name: Verify & Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'storage-functions/**'
      - 'sql/**'
      - '.github/workflows/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 测试门禁：云函数与 Flutter 任一项失败都不再构建 APK
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 仓库不含锁文件，故用 npm install 而非 npm ci
      - name: Install cloud function deps
        working-directory: storage-functions
        run: npm install --no-audit --no-fund

      - name: Build cloud functions
        working-directory: storage-functions
        run: npm run build

      - name: Test cloud functions
        working-directory: storage-functions
        run: npm test

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与本地开发环境一致（Flutter 3.47.8 / Dart 3.13.7），
          # 不钉版本会让 CI 的 stable 漂移，本地绿灯 CI 红灯无从对照
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Install app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Drift code
        working-directory: app
        run: dart run build_runner build

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: app
        run: flutter test

  build-apk:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      # 仓库刻意不包含 Android 二进制资源（应用图标、gradle-wrapper.jar 等），
      # 此处重建缺失的平台文件；已存在的文件不会被覆盖
      - name: Recreate missing Android platform files
        working-directory: app
        run: flutter create . --platforms android --project-name trace_app

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Drift code
        working-directory: app
        run: dart run build_runner build

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace-app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # 打 tag（如 v0.1.0）时自动发布 GitHub Release，附带 APK 供直接下载
      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
