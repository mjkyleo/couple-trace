name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 仓库刻意不包含 Android 二进制资源（应用图标、gradle-wrapper.jar 等），
      # 此处重建缺失的平台文件；已存在的文件不会被覆盖
      - name: Recreate missing Android platform files
        working-directory: app
        run: flutter create . --platforms android --project-name trace_app

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Drift code
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace-app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # 打 tag（如 v0.1.0）时自动发布 GitHub Release，附带 APK 供直接下载
      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
